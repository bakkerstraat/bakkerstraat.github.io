name: adoption-pulse weekly update

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scipy requests lxml
      - name: Rebuild model
        env:
          ASSUMED_LOW: "55000"
        run: python adoption-pulse/scripts/adoption_pulse.py
      - name: Commit data
        run: |
          git config user.name "adoption-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add adoption-pulse/data
          git diff --cached --quiet || git commit -m "adoption-pulse: weekly update $(date -u +%F)"
          git push
